server:
  port: ${SERVER_PORT:9090}

spring:
  application:
    name: vendor-simulator
  task:
    execution:
      pool:
        core-size: 4

vendorsim:
  callback-url: ${CALLBACK_URL:http://localhost:8080/webhooks/verifypro}
  webhook-secret: ${WEBHOOK_SHARED_SECRET:}
  callback-delay-ms: ${CALLBACK_DELAY_MS:1500}

logging:
  level:
    dev.portfolio.vendorsim: INFO
