spring:
  application:
    name: verification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/verifyflow}
    username: ${DB_USER:verifyflow}
    password: ${DB_PASSWORD:verifyflow}
  jpa:
    hibernate:
      # Flyway owns the schema. validate means a drift between entity and migration is a startup
      # failure rather than a silent auto-alter.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:guest}
    password: ${RABBIT_PASSWORD:guest}
    listener:
      simple:
        # At-least-once. We ack after the handler returns, so a crash mid-handle redelivers.
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-attempts: 4
          max-interval: 10s

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.show-details: when-authorized

verifyflow:
  vendor:
    base-url: ${VENDOR_BASE_URL:http://localhost:9090}
    # Sent to the vendor on session creation. Env-only; there is no committed default on purpose.
    api-key: ${VENDOR_API_KEY:}
    connect-timeout: 3s
    read-timeout: 10s
  webhook:
    # Shared secret the vendor echoes back. Defence in depth only - the webhook is a trigger and the
    # outcome is always re-fetched, so this is not the control that protects correctness.
    shared-secret: ${WEBHOOK_SHARED_SECRET:}
    require-secret: ${WEBHOOK_REQUIRE_SECRET:true}
  reconcile:
    queue: verifyflow.reconcile
    exchange: verifyflow.reconcile.exchange
    routing-key: reconcile
    dlq: verifyflow.reconcile.dlq
  expiry:
    # How long a request may sit in a transient state before the sweeper expires it.
    transient-ttl: ${EXPIRY_TTL:PT15M}
    sweep-interval-ms: ${EXPIRY_SWEEP_MS:60000}
  readmodel:
    # A summary older than this is rebuilt on read rather than served stale.
    max-age: ${READMODEL_MAX_AGE:PT30S}
  insight:
    # A transient request older than this multiple of its cohort median is called out as stuck.
    stuck-multiplier: 3.0
    # Floor so a tiny/empty cohort cannot make everything look stuck.
    stuck-floor: PT5M
  llm:
    enabled: ${LLM_ENABLED:true}
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${LLM_MODEL:claude-opus-5}
    max-tokens: 900
    timeout: 30s

logging:
  level:
    dev.portfolio.verifyflow: INFO
